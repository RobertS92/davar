<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripture App - Admin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #9ca3af; margin-bottom: 30px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
    }
    .stat-label {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #6366f1;
    }
    .stat-sublabel {
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }
    .chart-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
    }
    .chart-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #f3f4f6;
    }
    .chart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .chart-item:last-child { border-bottom: none; }
    .chart-label { color: #d1d5db; }
    .chart-value {
      font-weight: 600;
      color: #6366f1;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }
    .spinner {
      border: 3px solid #2a2a2a;
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      color: #fca5a5;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .refresh-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .refresh-btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Admin Dashboard</h1>
    <p class="subtitle">Real-time analytics for Scripture Playlist App</p>

    <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading analytics...</p>
    </div>

    <div id="error" style="display: none;"></div>

    <div id="dashboard" style="display: none;">
      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Users</div>
          <div class="stat-value" id="totalUsers">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Today</div>
          <div class="stat-value" id="activeToday">0</div>
          <div class="stat-sublabel" id="activeWeek">0 this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Playlists</div>
          <div class="stat-value" id="totalPlaylists">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Session</div>
          <div class="stat-value" id="avgSession">0</div>
          <div class="stat-sublabel">seconds</div>
        </div>
      </div>

      <!-- Charts Grid -->
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">🔥 Top Features</div>
          <div id="featureChart"></div>
        </div>

        <div class="chart-card">
          <div class="chart-title">📻 Popular Stations</div>
          <div id="stationChart"></div>
        </div>

        <div class="chart-card">
          <div class="chart-title">🌙 Popular Modes</div>
          <div id="modeChart"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';

    async function loadData() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const dashboard = document.getElementById('dashboard');

      loading.style.display = 'block';
      error.style.display = 'none';
      dashboard.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/analytics/summary`);
        if (!response.ok) throw new Error('Failed to fetch analytics');

        const data = await response.json();

        // Update stats
        document.getElementById('totalUsers').textContent = data.totalUsers.toLocaleString();
        document.getElementById('activeToday').textContent = data.activeUsers.today.toLocaleString();
        document.getElementById('activeWeek').textContent = `${data.activeUsers.week.toLocaleString()} this week`;
        document.getElementById('totalPlaylists').textContent = data.totalPlaylists.toLocaleString();
        document.getElementById('avgSession').textContent = data.avgSessionDuration.toLocaleString();

        // Update charts
        renderChart('featureChart', data.featureUsage);
        renderChart('stationChart', data.popularStations);
        renderChart('modeChart', data.popularModes);

        loading.style.display = 'none';
        dashboard.style.display = 'block';

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.className = 'error';
        error.innerHTML = `
          <strong>Error loading data:</strong><br>
          ${err.message}<br><br>
          <small>Make sure the backend server is running on ${API_URL}</small>
        `;
      }
    }

    function renderChart(elementId, data) {
      const container = document.getElementById(elementId);
      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color: #6b7280; text-align: center; padding: 20px;">No data available</p>';
        return;
      }

      const maxValue = Math.max(...data.map(d => d.count));
      container.innerHTML = data.map(item => {
        const label = item.feature || item.station || item.mode || 'Unknown';
        const percentage = maxValue > 0 ? (item.count / maxValue * 100) : 0;

        return `
          <div class="chart-item">
            <div style="flex: 1;">
              <div class="chart-label">${label || 'Unknown'}</div>
              <div style="background: #2a2a2a; height: 6px; border-radius: 3px; margin-top: 6px; overflow: hidden;">
                <div style="background: #6366f1; height: 100%; width: ${percentage}%; transition: width 0.3s;"></div>
              </div>
            </div>
            <div class="chart-value" style="margin-left: 16px;">${item.count}</div>
          </div>
        `;
      }).join('');
    }

    // Load data on page load
    loadData();

    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  </script>
</body>
</html>
